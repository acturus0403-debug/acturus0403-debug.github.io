<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaBroc - Simulateur d'annonce</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto w-full max-w-5xl p-4 sm:p-6 lg:p-8">
    <header class="mb-6 rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <div class="flex items-center justify-between gap-4">
        <h1 class="text-2xl font-black tracking-tight sm:text-3xl">
          <span class="bg-gradient-to-r from-fuchsia-600 to-cyan-600 bg-clip-text text-transparent">NovaBroc</span>
        </h1>
        <p class="text-xs text-slate-500 sm:text-sm">Mockup d'annonces fictives</p>
      </div>
    </header>

    <section id="formView" class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6">
      <h2 class="mb-4 text-lg font-bold">Créer une annonce</h2>

      <form id="adForm" class="space-y-4">
        <div>
          <label class="mb-2 block text-sm font-semibold">Photos</label>
          <label for="photos" class="inline-flex cursor-pointer items-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
            Importer des photos
          </label>
          <input id="photos" class="hidden" type="file" accept="image/*" multiple />
          <p class="mt-2 text-xs text-slate-500">Mobile et ordinateur. Plusieurs photos possibles.</p>
          <div id="photoPreview" class="mt-3 grid grid-cols-3 gap-2 sm:grid-cols-4"></div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label for="title" class="mb-1 block text-sm font-semibold">Titre</label>
            <input id="title" required class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring" placeholder="Ex: Veste en jean bleu" />
          </div>

          <div class="sm:col-span-2">
            <label for="description" class="mb-1 block text-sm font-semibold">Description</label>
            <textarea id="description" required rows="4" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring" placeholder="Décris l'article, ses détails, défauts éventuels..."></textarea>
          </div>

          <div>
            <label for="price" class="mb-1 block text-sm font-semibold">Prix (€)</label>
            <input id="price" required type="number" min="0" step="0.01" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring" placeholder="25" />
          </div>

          <div>
            <label for="category" class="mb-1 block text-sm font-semibold">Catégorie</label>
            <select id="category" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring">
              <option>vêtements</option>
              <option>chaussures</option>
              <option>accessoires</option>
              <option>électronique</option>
              <option>maison</option>
              <option>jeux</option>
              <option>autres</option>
            </select>
          </div>

          <div>
            <label for="condition" class="mb-1 block text-sm font-semibold">État</label>
            <select id="condition" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring">
              <option>neuf avec étiquette</option>
              <option>neuf sans étiquette</option>
              <option>très bon état</option>
              <option>bon état</option>
              <option>satisfaisant</option>
            </select>
          </div>

          <div>
            <label for="color" class="mb-1 block text-sm font-semibold">Couleur</label>
            <select id="color" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring">
              <option>Noir</option>
              <option>Blanc</option>
              <option>Gris</option>
              <option>Bleu</option>
              <option>Rouge</option>
              <option>Vert</option>
              <option>Jaune</option>
              <option>Rose</option>
              <option>Violet</option>
              <option>Marron</option>
              <option>Beige</option>
              <option>Multicolore</option>
            </select>
          </div>

          <div>
            <label for="brand" class="mb-1 block text-sm font-semibold">Marque (facultatif)</label>
            <input id="brand" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring" placeholder="Ex: Zara" />
          </div>

          <div>
            <label for="size" class="mb-1 block text-sm font-semibold">Taille (facultatif)</label>
            <input id="size" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-fuchsia-300 focus:ring" placeholder="Ex: M / 38 / 42" />
          </div>
        </div>

        <button class="rounded-xl bg-gradient-to-r from-fuchsia-600 to-cyan-600 px-4 py-2 font-semibold text-white shadow-sm hover:opacity-95" type="submit">
          Générer l'annonce
        </button>
      </form>
    </section>

    <section id="previewView" class="hidden rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-lg font-bold">Aperçu de l'annonce</h2>
        <div class="flex gap-2">
          <button id="editBtn" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50">Modifier</button>
          <button id="downloadBtn" class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">Télécharger l'aperçu</button>
        </div>
      </div>

      <article class="overflow-hidden rounded-3xl border border-slate-200 bg-white">
        <img id="adMainImage" class="h-72 w-full bg-slate-100 object-cover sm:h-96" alt="Photo annonce" />
        <div id="adThumbs" class="grid grid-cols-4 gap-1 p-1 sm:grid-cols-6"></div>

        <div class="space-y-3 p-4 sm:p-5">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <h3 id="adTitle" class="text-xl font-bold"></h3>
            <p id="adPrice" class="text-xl font-black text-fuchsia-700"></p>
          </div>

          <div class="grid gap-2 text-sm text-slate-700 sm:grid-cols-2">
            <p><span class="font-semibold">État:</span> <span id="adCondition"></span></p>
            <p><span class="font-semibold">Couleur:</span> <span id="adColor"></span></p>
            <p><span class="font-semibold">Catégorie:</span> <span id="adCategory"></span></p>
            <p><span class="font-semibold">Marque:</span> <span id="adBrand"></span></p>
            <p><span class="font-semibold">Taille:</span> <span id="adSize"></span></p>
          </div>

          <p id="adDescription" class="whitespace-pre-wrap text-sm leading-relaxed text-slate-700"></p>
        </div>
      </article>
    </section>
  </main>

  <script>
    const formView = document.getElementById('formView');
    const previewView = document.getElementById('previewView');
    const photoInput = document.getElementById('photos');
    const photoPreview = document.getElementById('photoPreview');
    const adForm = document.getElementById('adForm');
    const editBtn = document.getElementById('editBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    let photos = [];

    const fields = {
      title: document.getElementById('title'),
      description: document.getElementById('description'),
      price: document.getElementById('price'),
      category: document.getElementById('category'),
      condition: document.getElementById('condition'),
      color: document.getElementById('color'),
      brand: document.getElementById('brand'),
      size: document.getElementById('size')
    };

    const out = {
      mainImage: document.getElementById('adMainImage'),
      thumbs: document.getElementById('adThumbs'),
      title: document.getElementById('adTitle'),
      price: document.getElementById('adPrice'),
      category: document.getElementById('adCategory'),
      condition: document.getElementById('adCondition'),
      color: document.getElementById('adColor'),
      brand: document.getElementById('adBrand'),
      size: document.getElementById('adSize'),
      description: document.getElementById('adDescription')
    };

    function renderInputPreviews() {
      photoPreview.innerHTML = '';
      photos.forEach((p, i) => {
        const box = document.createElement('div');
        box.className = 'relative overflow-hidden rounded-xl border border-slate-200';
        box.innerHTML = `
          <img src="${p.url}" class="h-24 w-full object-cover" alt="photo ${i + 1}">
          <button type="button" data-remove="${i}" class="absolute right-1 top-1 rounded bg-black/60 px-2 py-0.5 text-xs text-white">x</button>
        `;
        photoPreview.appendChild(box);
      });
    }

    photoInput.addEventListener('change', (e) => {
      const selected = [...e.target.files].filter((f) => f.type.startsWith('image/'));
      selected.forEach((file) => photos.push({ file, url: URL.createObjectURL(file) }));
      renderInputPreviews();
      e.target.value = '';
    });

    photoPreview.addEventListener('click', (e) => {
      const idx = e.target.dataset.remove;
      if (idx === undefined) return;
      URL.revokeObjectURL(photos[idx].url);
      photos.splice(idx, 1);
      renderInputPreviews();
    });

    adForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!photos.length) return alert('Ajoute au moins une photo.');

      out.mainImage.src = photos[0].url;
      out.title.textContent = fields.title.value.trim();
      out.price.textContent = `${Number(fields.price.value || 0).toFixed(2)} €`;
      out.category.textContent = fields.category.value;
      out.condition.textContent = fields.condition.value;
      out.color.textContent = fields.color.value;
      out.brand.textContent = fields.brand.value.trim() || '-';
      out.size.textContent = fields.size.value.trim() || '-';
      out.description.textContent = fields.description.value.trim();

      out.thumbs.innerHTML = '';
      photos.forEach((p, i) => {
        const img = document.createElement('img');
        img.src = p.url;
        img.alt = `Miniature ${i + 1}`;
        img.className = 'h-16 w-full cursor-pointer rounded-lg object-cover';
        img.addEventListener('click', () => (out.mainImage.src = p.url));
        out.thumbs.appendChild(img);
      });

      formView.classList.add('hidden');
      previewView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    editBtn.addEventListener('click', () => {
      previewView.classList.add('hidden');
      formView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function drawWrapped(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + ' ';
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = words[i] + ' ';
          y += lineHeight;
        } else {
          line = test;
        }
      }
      ctx.fillText(line, x, y);
      return y;
    }

    downloadBtn.addEventListener('click', () => {
      if (!photos.length) return;
      const canvas = document.createElement('canvas');
      canvas.width = 1080;
      canvas.height = 1350;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.src = photos[0].url;

      img.onload = () => {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const imgH = 700;
        const scale = Math.max(canvas.width / img.width, imgH / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (canvas.width - w) / 2, (imgH - h) / 2, w, h);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 700, canvas.width, 650);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 52px sans-serif';
        ctx.fillText(fields.title.value.trim() || 'Annonce', 60, 790);

        ctx.fillStyle = '#a21caf';
        ctx.font = 'bold 50px sans-serif';
        ctx.fillText(`${Number(fields.price.value || 0).toFixed(2)} €`, 60, 860);

        ctx.fillStyle = '#334155';
        ctx.font = '34px sans-serif';
        ctx.fillText(`Etat: ${fields.condition.value} | Couleur: ${fields.color.value}`, 60, 930);
        ctx.fillText(`Categorie: ${fields.category.value} | Marque: ${fields.brand.value.trim() || '-'}`, 60, 980);
        ctx.fillText(`Taille: ${fields.size.value.trim() || '-'}`, 60, 1030);

        ctx.fillStyle = '#0f172a';
        ctx.font = '30px sans-serif';
        drawWrapped(ctx, fields.description.value.trim(), 60, 1110, 960, 40);

        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'apercu-annonce.png';
        a.click();
      };
    });
  </script>
</body>
</html>
